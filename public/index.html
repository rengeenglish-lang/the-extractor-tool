<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link to MP3</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --text: #1c1c1a; --muted: #6b6a64;
    --border: #e2e0da; --accent: #2f6f5e; --accent-hover: #245949;
    --danger: #a33a2b; --ok: #2f6f3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --text: #ecebe6; --muted: #9a998f;
      --border: #33332f; --accent: #5fb89f; --accent-hover: #7cc9b2;
      --danger: #e0786a; --ok: #7cc98a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="url"] { flex: 1 1 360px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  button { font: inherit; border-radius: 8px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--accent); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button.ghost:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 14px; min-height: 22px; margin: 12px 2px 0; color: var(--muted); }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .drive { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 14px; }
  .drive .state { color: var(--muted); }
  .drive .state b { color: var(--ok); font-weight: 600; }
  .bar { height: 6px; margin: 14px 2px 0; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .hidden { display: none !important; }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Link to MP3</h1>
  <p class="sub">Paste a link. The audio is converted and sent straight to your device. Nothing is stored on the server.</p>

  <div class="panel">
    <form id="form" autocomplete="off">
      <input type="url" id="url" placeholder="https://" required>
      <button type="submit" class="primary" id="go">Extract audio</button>
    </form>
    <div class="bar hidden" id="bar"><div id="barFill"></div></div>
    <div class="status" id="status"></div>

    <div class="drive">
      <div class="state" id="driveState">Google Drive: not connected</div>
      <div>
        <button class="ghost hidden" id="driveConnect">Connect Google Drive</button>
        <button class="ghost hidden" id="driveDisconnect">Disconnect</button>
      </div>
    </div>
  </div>

  <footer>Only process content you have the right to use.</footer>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const statusEl = $('#status');

  function setStatus(text, cls) {
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
    statusEl.textContent = text;
  }

  function fmtMB(bytes) { return (bytes / 1024 / 1024).toFixed(1) + ' MB'; }

  // ---------- Google Drive state ----------
  async function loadMe() {
    try {
      const me = await (await fetch('/api/me')).json();
      renderDrive(me);
    } catch (_) {}
  }

  function renderDrive(me) {
    const state = $('#driveState');
    const connect = $('#driveConnect');
    const disconnect = $('#driveDisconnect');
    if (me.drive) {
      state.innerHTML = '';
      const b = document.createElement('b');
      b.textContent = 'Connected';
      state.append('Google Drive: ', b, ' · each extraction is also saved to Drive');
      connect.classList.add('hidden');
      disconnect.classList.remove('hidden');
    } else {
      state.textContent = 'Google Drive: not connected';
      disconnect.classList.add('hidden');
      connect.classList.toggle('hidden', !me.driveConfigured);
      if (!me.driveConfigured) state.textContent += ' (not configured on the server)';
    }
  }

  $('#driveConnect').addEventListener('click', () => { location.href = '/auth/google'; });
  $('#driveDisconnect').addEventListener('click', async () => {
    await fetch('/auth/google/disconnect', { method: 'POST' });
    loadMe();
  });

  // ---------- Extract and save to device ----------
  function filenameFrom(disposition) {
    if (!disposition) return 'audio.mp3';
    const star = /filename\*=UTF-8''([^;]+)/i.exec(disposition);
    if (star) return decodeURIComponent(star[1]);
    const plain = /filename="([^"]+)"/i.exec(disposition);
    return plain ? plain[1] : 'audio.mp3';
  }

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = $('#url').value.trim();
    if (!url) return;

    const btn = $('#go');
    btn.disabled = true;
    const t0 = Date.now();
    const secs = () => Math.round((Date.now() - t0) / 1000) + 's';
    const bar = $('#bar');
    const barFill = $('#barFill');
    bar.classList.add('hidden');
    barFill.style.width = '0%';
    setStatus('Finding the audio…');
    const wait = setInterval(() => setStatus(`Finding the audio… ${secs()}`), 1000);

    try {
      const res = await fetch('/api/extract?url=' + encodeURIComponent(url));
      clearInterval(wait);
      if (!res.ok) {
        let msg = 'Extraction failed.';
        try { msg = (await res.json()).error || msg; } catch (_) {}
        setStatus(msg, 'err');
        return;
      }

      // Read the stream as it arrives so progress is visible.
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      const expected = Number(res.headers.get('X-Expected-Size')) || 0;
      if (expected) bar.classList.remove('hidden');
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (expected) {
          const pct = Math.min(99, Math.floor((received / expected) * 100));
          barFill.style.width = pct + '%';
          setStatus(`Downloading… ${pct}% (${fmtMB(received)}) · ${secs()}`);
        } else {
          setStatus(`Downloading… ${fmtMB(received)} · ${secs()}`);
        }
      }
      barFill.style.width = '100%';

      const blob = new Blob(chunks, { type: 'audio/mpeg' });
      const name = filenameFrom(res.headers.get('Content-Disposition'));
      const objectUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 60 * 1000);

      setStatus(`Saved to your device: ${name} (${fmtMB(received)}) in ${secs()}`, 'ok');
      $('#url').value = '';
    } catch (err) {
      setStatus('Could not reach the server, or the download was interrupted.', 'err');
    } finally {
      clearInterval(wait);
      btn.disabled = false;
    }
  });

  loadMe();
})();
</script>
</body>
</html>
